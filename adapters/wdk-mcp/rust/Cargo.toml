[package]
name = "acta-wdk-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Isolated from the repository workspace on purpose, like the OpenWorker connector. It
# consumes the public crates without joining the workspace graph, which keeps the root
# Cargo.toml and Cargo.lock — both fixed by ratified hash tables — untouched.
[workspace]

[lib]
name = "acta_wdk_mcp"
path = "src/lib.rs"

[dependencies]
acta-ai-agent-profile = { path = "../../../profiles/ai-agent/rust" }
acta-ai-agent-profile-v1-1 = { path = "../../../profiles/ai-agent/v1_1/rust" }
acta-core = { path = "../../../core/rust/acta-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
