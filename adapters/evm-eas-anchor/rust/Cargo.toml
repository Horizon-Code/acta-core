[package]
name = "acta-evm-eas-anchor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "acta_evm_eas_anchor"
path = "src/lib.rs"

[dependencies]
acta-core = { path = "../../../core/rust/acta-core" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
thiserror = "2.0"
