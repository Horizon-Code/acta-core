[package]
name = "acta-s9-openworker-artifact1"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Isolated from the repository workspace, like the C2 demonstrator. It consumes the public
# crates without joining the workspace graph, so the root Cargo.toml and Cargo.lock fixed by
# the ADR-012/013 hash tables stay untouched.
[workspace]

[dependencies]
acta-attestation-single-signer = { path = "../../adapters/attestation-single-signer/rust" }
acta-ai-agent-profile = { path = "../../profiles/ai-agent/rust" }
acta-core = { path = "../../core/rust/acta-core" }
acta-openworker-mcp = { path = "../../adapters/openworker-mcp/rust" }
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
